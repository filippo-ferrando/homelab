global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    dns_sd_configs:
      - names:
          - "tasks.node-exporter"
        type: "A"
        port: 9100

  - job_name: "cadvisor"
    dns_sd_configs:
      - names:
          - "tasks.cadvisor"
        type: "A"
        port: 8080

  - job_name: "pushgateway"
    honor_labels: true
    dns_sd_configs:
      - names:
          - "tasks.pushgateway"
        type: "A"
        port: 9091

  - job_name: "pgpool2"
    dns_sd_configs:
      - names:
          - "tasks.pgpool2_exporter"
        type: "A"
        port: 9719

  - job_name: "glusterfs"
    static_configs:
      - targets:
          - "192.168.10.100:9713"
          - "192.168.10.101:9713"
          - "192.168.10.102:9713"
          - "192.168.10.103:9713"
