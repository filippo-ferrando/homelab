networks:
  db_network:
    external: true
  monitoring:
    external: true

volumes:
  pg_0_data:
  pg_1_data:
  pg_2_data:

secrets:
  postgres_root_password:
    external: true
  pgpool_admin_password:
    external: true

services:
  pgpool:
    image: docker.io/bitnami/pgpool:latest
    networks:
      - db_network
    environment:
      - PGPOOL_BACKEND_NODES=0:pg-0:5432,1:pg-1:5432,2:pg-2:5432
      - PGPOOL_SR_CHECK_USER=repmgr
      - PGPOOL_SR_CHECK_PASSWORD=repmgrpassword
      - PGPOOL_ENABLE_LDAP=no
      - PGPOOL_POSTGRES_USERNAME=postgres
      - PGPOOL_POSTGRES_PASSWORD=super_secret_root_password
      - PGPOOL_ADMIN_USERNAME=admin
      - PGPOOL_ADMIN_PASSWORD=adminpassword
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  pgpool2_exporter:
    image: pgpool/pgpool2_exporter:latest
    networks:
      - db_network
      - monitoring
    environment:
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=super_secret_root_password
      - POSTGRES_DATABASE=postgres
      - PGPOOL_SERVICE=pgpool
      - PGPOOL_SERVICE_PORT=9999
    deploy:
      placement:
        constraints:
          - node.role == manager

  pg-0:
    image: docker.io/bitnami/postgresql-repmgr:latest
    networks:
      - db_network
    volumes:
      - pg_0_data:/bitnami/postgresql
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=super_secret_root_password
      - POSTGRESQL_USERNAME=my_app_user
      - POSTGRESQL_PASSWORD=my_app_password
      - POSTGRESQL_DATABASE=my_app_db
      - REPMGR_PRIMARY_HOST=pg-0
      - REPMGR_PARTNER_NODES=pg-0,pg-1,pg-2
      - REPMGR_NODE_NAME=pg-0
      - REPMGR_NODE_NETWORK_NAME=pg-0
      - REPMGR_USERNAME=repmgr
      - REPMGR_PASSWORD=repmgrpassword
    deploy:
      placement:
        preferences:
          - spread: node.id

  pg-1:
    image: docker.io/bitnami/postgresql-repmgr:latest
    networks:
      - db_network
    volumes:
      - pg_1_data:/bitnami/postgresql
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=super_secret_root_password
      - POSTGRESQL_USERNAME=my_app_user
      - POSTGRESQL_PASSWORD=my_app_password
      - POSTGRESQL_DATABASE=my_app_db
      - REPMGR_PRIMARY_HOST=pg-0
      - REPMGR_PARTNER_NODES=pg-0,pg-1,pg-2
      - REPMGR_NODE_NAME=pg-1
      - REPMGR_NODE_NETWORK_NAME=pg-1
      - REPMGR_USERNAME=repmgr
      - REPMGR_PASSWORD=repmgrpassword
    deploy:
      placement:
        preferences:
          - spread: node.id

  pg-2:
    image: docker.io/bitnami/postgresql-repmgr:latest
    networks:
      - db_network
    volumes:
      - pg_2_data:/bitnami/postgresql
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=super_secret_root_password
      - POSTGRESQL_USERNAME=my_app_user
      - POSTGRESQL_PASSWORD=my_app_password
      - POSTGRESQL_DATABASE=my_app_db
      - REPMGR_PRIMARY_HOST=pg-0
      - REPMGR_PARTNER_NODES=pg-0,pg-1,pg-2
      - REPMGR_NODE_NAME=pg-2
      - REPMGR_NODE_NETWORK_NAME=pg-2
      - REPMGR_USERNAME=repmgr
      - REPMGR_PASSWORD=repmgrpassword
    deploy:
      placement:
        preferences:
          - spread: node.id
